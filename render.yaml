# Render blueprint for the backend half of the stack: NestJS API + Postgres.
# The frontend is deployed separately on Vercel — nothing here builds it.
#
# Apply with: Render dashboard → New → Blueprint → point at this repo.
# Nothing in this file is Render-specific beyond the schema; the API is a plain
# Docker image driven by env vars, so Railway/Fly/Koyeb need the same variables
# and no code changes.

services:
  - type: web
    name: communityhub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # /health is @Public, so probes need no session
    healthCheckPath: /health
    envVars:
      # switches docker-entrypoint.sh to migrate + `node dist/main`
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Supabase session pooler (port 5432 + pooler.supabase.com host), not the
      # direct connection — that one is IPv6-only without the paid add-on.
      # Session mode, not transaction mode (6543): the RSVP path holds
      # SELECT ... FOR UPDATE row locks inside a transaction and the app runs
      # its own pg pool, both of which session mode leaves alone.
      #
      # MUST end with ?sslmode=require. Supabase refuses cleartext, and pg
      # parses a missing sslmode as "no TLS" rather than defaulting it on.
      #
      # Unsynced: it embeds the database password.
      - key: DATABASE_URL
        sync: false

      # Set to the Vercel origin, scheme included, no trailing slash:
      #   https://your-app.vercel.app
      # Comma-separate to also allow preview deploys. Left unsynced because it
      # is the one value only you know.
      - key: CORS_ORIGIN
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7

      # Web and API sit on different domains, so the auth cookies must be
      # SameSite=None (and therefore Secure) or the browser discards them.
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: none

# No `databases:` block: Postgres is hosted on Supabase, supplied via
# DATABASE_URL above. Render's free tier deletes a database after 30 days,
# which is the wrong property for anything meant to stay reachable.

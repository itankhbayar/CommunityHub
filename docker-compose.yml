services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-communityhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-communityhub}
      POSTGRES_DB: ${POSTGRES_DB:-communityhub}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api waits on this so the first migration never races an unready server
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-communityhub} -d ${POSTGRES_DB:-communityhub}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing email instead of delivering it, and shows them at
  # http://localhost:8025. This is what keeps `docker compose up` credential-free
  # on a clean machine — no provider account, no API key, works offline.
  # Production points SMTP_HOST/PORT/USER/PASSWORD at a real provider instead.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      # inotify events do not cross Windows/macOS bind mounts; poll instead so
      # the in-container dev server actually sees host file edits
      CHOKIDAR_USEPOLLING: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-communityhub}:${POSTGRES_PASSWORD:-communityhub}@db:5432/${POSTGRES_DB:-communityhub}?schema=public
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # compose is same-origin (both on localhost), so the strict defaults hold
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Defaults keep every message inside Mailpit. Overriding these in .env
      # points the stack at a real provider, which is how you check credentials
      # before trusting them in production — see .env.example.
      #
      # BEWARE: once overridden, mail actually leaves your machine. Registering
      # a test account then mails whatever address you typed, to a stranger if
      # it happens to exist.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: '${SMTP_PORT:-1025}'
      # Mailpit accepts unauthenticated mail; empty means the mailer sends no
      # credentials at all, which is what it wants.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-CommunityHub <no-reply@communityhub.local>}
      # emailed links point at the web app, which is host-visible, not at the
      # compose-internal hostname
      APP_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - ./backend:/app
      # anonymous volume: keeps the image's node_modules from being shadowed
      # by the host bind mount above (host may have none, or wrong-platform binaries)
      - /app/node_modules

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      # browser-side calls, so this is the host-visible API URL, not the compose hostname
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      # same polling reason as the api service
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
